name: Build & Release macOS Ventura (Intel)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build macOS Ventura Intel
    # Runner Intel terbaru; biner ditargetkan untuk macOS Ventura 13.x x86_64.
    runs-on: macos-26-intel

    steps:
      - name: Set CEF path
        run: echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin-ventura

      - name: Download CEF 132.3.2 (macOS x64)
        id: download
        run: |
          set -o pipefail
          if ! {
            set -e
            NAME="cef_binary_132.3.2+g4997b2f+chromium-132.0.6834.161_macosx64"
            URL_NAME="${NAME//+/%2B}"
            rm -rf "$RUNNER_TEMP/cef-extract" "$CEF_PATH"
            mkdir -p "$RUNNER_TEMP/cef-extract" "$CEF_PATH"
            ok=0
            for attempt in 1 2 3; do
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
                -o "$RUNNER_TEMP/cef.tar.bz2" \
                "https://cef-builds.spotifycdn.com/${URL_NAME}.tar.bz2" || true
              if [ "$(wc -c < "$RUNNER_TEMP/cef.tar.bz2" 2>/dev/null || echo 0)" -eq 279189289 ]; then
                ok=1
                break
              fi
              echo "download attempt $attempt had a truncated file, retrying"
              rm -f "$RUNNER_TEMP/cef.tar.bz2"
            done
            [ "$ok" -eq 1 ] || { echo "CEF download size mismatch"; exit 1; }
            SRC="$RUNNER_TEMP/cef-extract/$NAME"
            tar -xjf "$RUNNER_TEMP/cef.tar.bz2" -C "$RUNNER_TEMP/cef-extract"
            cp -R "$SRC/Release/." "$CEF_PATH/"
            for item in CMakeLists.txt cmake include libcef_dll; do
              cp -R "$SRC/$item" "$CEF_PATH/"
            done
            cp -R "$SRC/CREDITS.html" "$CEF_PATH/" 2>/dev/null || true
            if [ -f "$SRC/Release/cef_sandbox.a" ]; then
              cp "$SRC/Release/cef_sandbox.a" "$CEF_PATH/libcef_sandbox.a"
            elif [ -f "$SRC/cef_sandbox.a" ]; then
              cp "$SRC/cef_sandbox.a" "$CEF_PATH/libcef_sandbox.a"
            fi
            test -d "$CEF_PATH/Chromium Embedded Framework.framework"
          } 2>&1 | tee cef-download.log; then
            err="$(tail -n 30 cef-download.log | tr '\n' ' ' | cut -c1-1500)"
            echo "err=$err" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Build RustWeb (x86_64-apple-darwin)
        id: build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -o pipefail
          if ! cargo build --release --target x86_64-apple-darwin 2>&1 | tee build.log; then
            err="$(tail -n 60 build.log | tr '\n' ' ' | cut -c1-2000)"
            echo "err=$err" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "FAILURE: ${{ steps.download.outputs.err }} ${{ steps.build.outputs.err }}"
        if: failure()
        run: |
          {
            echo '```text'
            tail -n 200 cef-download.log 2>/dev/null || true
            tail -n 200 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble RustWeb.app
        run: |
          set -euo pipefail
          APP="dist/RustWeb.app"
          TARGET="target/x86_64-apple-darwin/release"
          FW="Chromium Embedded Framework.framework"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"

          cp "$TARGET/rustweb" "$APP/Contents/MacOS/rustweb"
          cp Info.plist "$APP/Contents/Info.plist"
          cp -R "$CEF_PATH/$FW" "$APP/Contents/Frameworks/"
          cp assets/tray-template.png assets/tray-template-unread.png "$APP/Contents/Resources/"

          helpers=(
            "rustweb Helper (GPU)|gpu"
            "rustweb Helper (Renderer)|renderer"
            "rustweb Helper (Plugin)|plugin"
            "rustweb Helper (Alerts)|alerts"
            "rustweb Helper|main"
          )
          for entry in "${helpers[@]}"; do
            name="${entry%%|*}"
            suffix="${entry##*|}"
            helper="$APP/Contents/Frameworks/$name.app"
            mkdir -p "$helper/Contents/MacOS"
            cp "$TARGET/rustweb_helper" "$helper/Contents/MacOS/$name"
            chmod +x "$helper/Contents/MacOS/$name"
            cat > "$helper/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleName</key>
              <string>$name</string>
              <key>CFBundleDisplayName</key>
              <string>$name</string>
              <key>CFBundleIdentifier</key>
              <string>com.syuhadak27.rustweb.helper.$suffix</string>
              <key>CFBundleExecutable</key>
              <string>$name</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>0.3.2</string>
              <key>CFBundleShortVersionString</key>
              <string>0.3.2</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>RustWeb needs camera access for WhatsApp Web video calls.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>RustWeb needs microphone access for WhatsApp Web voice calls.</string>
          </dict>
          </plist>
          EOF
          done

      - name: Create icon.icns
        run: |
          set -euo pipefail
          mkdir -p icon.iconset dist/RustWeb.app/Contents/Resources
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o dist/RustWeb.app/Contents/Resources/icon.icns
          rm -rf icon.iconset

      - name: Ad-hoc sign the app bundle (hardened runtime, timestamped)
        run: |
          set -euo pipefail
          APP="dist/RustWeb.app"
          
          # Sign helper apps first (inner to outer)
          for helper in "$APP/Contents/Frameworks"/*.app; do
            codesign --force --sign - --entitlements entitlements.plist \
              --options runtime --timestamp "$helper"
          done
          
          # Sign the main framework
          codesign --force --sign - --entitlements entitlements.plist \
            --options runtime --timestamp "$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
          
          # Sign the main app bundle
          codesign --force --deep --sign - --entitlements entitlements.plist \
            --options runtime --timestamp "$APP"
          
          # Verify signatures
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP" || true

      - name: Create disk image
        run: |
          hdiutil create -volname RustWeb \
            -srcfolder dist/RustWeb.app \
            -ov -format UDZO \
            dist/RustWeb-macOS-Ventura-Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustWeb-macOS-Ventura-Intel
          path: dist/RustWeb-macOS-Ventura-Intel.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RustWeb ${{ github.ref_name }} (macOS Ventura Intel)
          files: dist/RustWeb-macOS-Ventura-Intel.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
