name: Build & Release macOS (Intel + Apple Silicon + Universal)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-26-intel
            cef: cef_binary_132.3.2+g4997b2f+chromium-132.0.6834.161_macosx64
            size: 279189289
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            cef: cef_binary_132.3.2+g4997b2f+chromium-132.0.6834.161_macosarm64
            size: 246088437
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Set CEF path
        run: echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download CEF (${{ matrix.arch }})
        id: download
        run: |
          set -o pipefail
          if ! {
            set -e
            URL_NAME="${{ matrix.cef }}"
            URL_NAME="${URL_NAME//+/%2B}"
            rm -rf "$RUNNER_TEMP/cef-extract" "$CEF_PATH"
            mkdir -p "$RUNNER_TEMP/cef-extract" "$CEF_PATH"
            ok=0
            for attempt in 1 2 3; do
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
                -o "$RUNNER_TEMP/cef.tar.bz2" \
                "https://cef-builds.spotifycdn.com/${URL_NAME}.tar.bz2" || true
              if [ "$(wc -c < "$RUNNER_TEMP/cef.tar.bz2" 2>/dev/null || echo 0)" -eq "${{ matrix.size }}" ]; then
                ok=1
                break
              fi
              echo "download attempt $attempt had a truncated file, retrying"
              rm -f "$RUNNER_TEMP/cef.tar.bz2"
            done
            [ "$ok" -eq 1 ] || { echo "CEF download size mismatch"; exit 1; }
            SRC="$RUNNER_TEMP/cef-extract/${{ matrix.cef }}"
            tar -xjf "$RUNNER_TEMP/cef.tar.bz2" -C "$RUNNER_TEMP/cef-extract"
            cp -R "$SRC/Release/." "$CEF_PATH/"
            for item in CMakeLists.txt cmake include libcef_dll; do
              cp -R "$SRC/$item" "$CEF_PATH/"
            done
            cp -R "$SRC/CREDITS.html" "$CEF_PATH/" 2>/dev/null || true
            if [ -f "$SRC/Release/cef_sandbox.a" ]; then
              cp "$SRC/Release/cef_sandbox.a" "$CEF_PATH/libcef_sandbox.a"
            elif [ -f "$SRC/cef_sandbox.a" ]; then
              cp "$SRC/cef_sandbox.a" "$CEF_PATH/libcef_sandbox.a"
            fi
            test -d "$CEF_PATH/Chromium Embedded Framework.framework"
          } 2>&1 | tee cef-download.log; then
            err="$(tail -n 30 cef-download.log | tr '\n' ' ' | cut -c1-1500)"
            echo "err=$err" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Build RustWeb (${{ matrix.target }})
        id: build
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -o pipefail
          if ! cargo build --release --target ${{ matrix.target }} 2>&1 | tee build.log; then
            err="$(tail -n 60 build.log | tr '\n' ' ' | cut -c1-2000)"
            echo "err=$err" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "FAILURE: ${{ steps.download.outputs.err }} ${{ steps.build.outputs.err }}"
        if: failure()
        run: |
          {
            echo '```text'
            tail -n 200 cef-download.log 2>/dev/null || true
            tail -n 200 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          STAGE="stage-${{ matrix.arch }}"
          mkdir -p "$STAGE/bin" "$STAGE/cef"
          cp "target/${{ matrix.target }}/release/rustweb" "$STAGE/bin/"
          cp "target/${{ matrix.target }}/release/rustweb_helper" "$STAGE/bin/"
          cp -R "$CEF_PATH/." "$STAGE/cef/"
          chmod +x "$STAGE/bin/rustweb" "$STAGE/bin/rustweb_helper"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: stage-${{ matrix.arch }}
          if-no-files-found: error

  package:
    name: package macOS bundles
    needs: build
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts

      - name: Create universal binaries and framework
        run: |
          set -euo pipefail
          X64="artifacts/build-x86_64"
          ARM="artifacts/build-arm64"
          DEST="dist/universal"
          mkdir -p "$DEST"
          lipo -create "$X64/bin/rustweb" "$ARM/bin/rustweb" -output "$DEST/rustweb"
          lipo -create "$X64/bin/rustweb_helper" "$ARM/bin/rustweb_helper" -output "$DEST/rustweb_helper"
          FW="Chromium Embedded Framework.framework"
          rm -rf "$DEST/$FW"
          cp -R "$ARM/cef/$FW" "$DEST/$FW"
          while IFS= read -r -d '' file; do
            rel="${file#$ARM/cef/$FW/}"
            other="$X64/cef/$FW/$rel"
            if [ -f "$other" ] && file -b "$file" | grep -q 'Mach-O'; then
              lipo -create "$other" "$file" -output "$file"
            fi
          done < <(find "$DEST/$FW" -type f -print0)

      - name: Assemble three app bundles
        run: |
          set -euo pipefail

          assemble() {
            local variant="$1" bin="$2" helper="$3" framework="$4"
            local app="dist/$variant/RustWeb.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources"
            cp "$bin" "$app/Contents/MacOS/rustweb"
            cp Info.plist "$app/Contents/Info.plist"
            cp -R "$framework" "$app/Contents/Frameworks/"
            cp assets/tray-template.png assets/tray-template-unread.png "$app/Contents/Resources/"

            local helpers=(
              "rustweb Helper (GPU)|gpu"
              "rustweb Helper (Renderer)|renderer"
              "rustweb Helper (Plugin)|plugin"
              "rustweb Helper (Alerts)|alerts"
              "rustweb Helper|main"
            )
            for entry in "${helpers[@]}"; do
              local name="${entry%%|*}" suffix="${entry##*|}"
              local helper_app="$app/Contents/Frameworks/$name.app"
              mkdir -p "$helper_app/Contents/MacOS"
              cp "$helper" "$helper_app/Contents/MacOS/$name"
              chmod +x "$helper_app/Contents/MacOS/$name"
              cat > "$helper_app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleName</key>
              <string>$name</string>
              <key>CFBundleDisplayName</key>
              <string>$name</string>
              <key>CFBundleIdentifier</key>
              <string>com.syuhadak27.rustweb.helper.$suffix</string>
              <key>CFBundleExecutable</key>
              <string>$name</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>0.3.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.3.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>RustWeb needs camera access for WhatsApp Web video calls.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>RustWeb needs microphone access for WhatsApp Web voice calls.</string>
          </dict>
          </plist>
          EOF
            done
          }

          FW="Chromium Embedded Framework.framework"
          assemble Intel \
            "artifacts/build-x86_64/bin/rustweb" \
            "artifacts/build-x86_64/bin/rustweb_helper" \
            "artifacts/build-x86_64/cef/$FW"
          assemble AppleSilicon \
            "artifacts/build-arm64/bin/rustweb" \
            "artifacts/build-arm64/bin/rustweb_helper" \
            "artifacts/build-arm64/cef/$FW"
          assemble Universal \
            "dist/universal/rustweb" \
            "dist/universal/rustweb_helper" \
            "dist/universal/$FW"

      - name: Create icons, sign, and package DMGs
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          for variant in Intel AppleSilicon Universal; do
            app="dist/$variant/RustWeb.app"
            iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
            codesign --force --deep --sign - --entitlements entitlements.plist "$app"
          done
          rm -rf icon.iconset

          hdiutil create -volname RustWeb -srcfolder dist/Intel/RustWeb.app \
            -ov -format UDZO dist/RustWeb-macOS-Intel.dmg
          hdiutil create -volname RustWeb -srcfolder dist/AppleSilicon/RustWeb.app \
            -ov -format UDZO dist/RustWeb-macOS-AppleSilicon.dmg
          hdiutil create -volname RustWeb -srcfolder dist/Universal/RustWeb.app \
            -ov -format UDZO dist/RustWeb-macOS-Universal.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RustWeb-macOS
          path: |
            dist/RustWeb-macOS-Intel.dmg
            dist/RustWeb-macOS-AppleSilicon.dmg
            dist/RustWeb-macOS-Universal.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RustWeb ${{ github.ref_name }} (macOS)
          files: |
            dist/RustWeb-macOS-Intel.dmg
            dist/RustWeb-macOS-AppleSilicon.dmg
            dist/RustWeb-macOS-Universal.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
